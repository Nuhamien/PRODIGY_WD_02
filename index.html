<!DOCTYPE html>
<html lang="en">
<head>
    <title>Stopwatch</title>
    <link rel="stylesheet" href="stopwatch.css">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
    <h1>Stopwatch</h1>
    <div class="content">
        <p id="main">
            <span id="hr">00</span><span id="min">00</span><span id="sec">00</span><span id="ms"></span>
        </p> 
    </div>
    <div class="buttons">
        <button id="begin">Start</button>
        <button id="finish">Stop</button>
        <button id="again">Reset</button>
        <button id="loop">Lap</button>
    </div>
    <ul id="lapList"></ul>

    <script>
        let startTime = 0;
        let elapsedTime = 0;
        let animationFrameId;
        let isRunning = false;

        function updateTime() {
            let currentTime = Date.now();
            elapsedTime = currentTime - startTime;

            let totalMilliseconds = elapsedTime;
            let totalSeconds = Math.floor(totalMilliseconds / 1000);
            let totalMinutes = Math.floor(totalSeconds / 60);
            let totalHours = Math.floor(totalMinutes / 60);

            let milliseconds = totalMilliseconds % 1000;
            let seconds = totalSeconds % 60;
            let minutes = totalMinutes % 60;
            let hours = totalHours;

            document.getElementById("hr").textContent = hours.toString().padStart(2, '0');
            document.getElementById("min").textContent = minutes.toString().padStart(2, '0');
            document.getElementById("sec").textContent = seconds.toString().padStart(2, '0');
            

            animationFrameId = requestAnimationFrame(updateTime);
        }

        let loop = document.getElementById("loop");
        let begin = document.getElementById("begin");
        let finish = document.getElementById("finish");
        let again = document.getElementById("again");
        let lapList = document.getElementById("lapList");

        // Start or Resume the stopwatch
        begin.addEventListener("click", function() {
            if (!isRunning) {
                startTime = Date.now() - elapsedTime; 
                animationFrameId = requestAnimationFrame(updateTime);
                finish.textContent = "Stop";
                isRunning = true;
            }
        });

        // Stop the stopwatch
        finish.addEventListener("click", function() {
            if (isRunning) {
                cancelAnimationFrame(animationFrameId); // Pause the stopwatch
                finish.textContent = "Resume"; // Change button text to Resume
                isRunning = false;
            } else {
                // Resume when "Resume" button is clicked
                startTime = Date.now() - elapsedTime; // Maintain elapsed time
                animationFrameId = requestAnimationFrame(updateTime);
                finish.textContent = "Stop";
                isRunning = true;
            }
        });

        // Reset the stopwatch
        again.addEventListener("click", function() {
            cancelAnimationFrame(animationFrameId);
            elapsedTime = 0;
            isRunning = false;
            document.getElementById("hr").textContent = "00";
            document.getElementById("min").textContent = "00";
            document.getElementById("sec").textContent = "00";
            document.getElementById("ms").textContent = "000";
            finish.textContent = "Stop";
            lapList.innerHTML = ''; // Clear lap list
        });

        // Record a lap
        loop.addEventListener("click", function() {
            let totalMilliseconds = elapsedTime;
            let totalSeconds = Math.floor(totalMilliseconds / 1000);
            let totalMinutes = Math.floor(totalSeconds / 60);
            let totalHours = Math.floor(totalMinutes / 60);

            let milliseconds = totalMilliseconds % 1000;
            let seconds = totalSeconds % 60;
            let minutes = totalMinutes % 60;
            let hours = totalHours;

            let lapItem = document.createElement("li");
            lapItem.textContent = `${hours.toString().padStart(2, '0')}${minutes.toString().padStart(2, '0')}${seconds.toString().padStart(2, '0')}`;
            lapList.appendChild(lapItem);
        });
    </script>
</body>
</html>
