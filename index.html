<!DOCTYPE html>
<html lang="en">
<head>
    <title>Stopwatch</title>
    <link rel="stylesheet" href="stopwatch.css">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
    <div class="container">
    <div class="stopwatchContainer">
    <h1>Stopwatch</h1>
    <div class="content">
        <p id="main">
            <span id="min">00</span><span id="sec">00</span><span id="ms">00</span>
        </p> 
    </div>
    <div class="buttons">
        <button id="begin">Start</button>
        <button id="again">Reset</button>
        <button id="loop">Lap</button>
    </div>
    </div>
    <ul id="lapList"></ul>
    <li ></li>
</div>
   

    <script src="script.js"> </script>
</body>
</html>
